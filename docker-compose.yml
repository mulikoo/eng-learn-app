
services:
  app:
    build: .
    container_name: eng-learn-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8080:8080"
    depends_on:
     - postgres
  postgres:
    image: postgres:18
    container_name: eng_learn_postgres
    environment:
      POSTGRES_DB: eng_learn_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: muliko08m
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: